[test]
# Gate the suite on per-file line coverage. Function coverage is intentionally
# not gated: Bun counts implicit class constructors as uncalled functions, which
# makes classes without an explicit constructor fail a function threshold even
# when every method is exercised. The stated goal is >80% line coverage.
coverageThreshold = { lines = 0.8, functions = 0 }
coverageReporter = ["text"]
coverageDir = "coverage"
# Compiled duplicates, test helpers, local quality tooling and React client
# components/hooks are out of scope for the production coverage gate. Quality
# helpers have their own unit tests; the React layer is covered by Playwright.
# `test/**` is deliberately NOT ignored: the LLM harness in `test/llm/` is
# ordinary logic that costs money when it is wrong, so it is held to the same 80%
# per file as `src/`. Only the test-support files stay out.
coveragePathIgnorePatterns = [
  "dist/**",
  "scripts/**",
  "test/e2e/**",
  "test/utils.ts",
  "test/start-server.ts",
  # The daemon-survival driver starts real opencode hosts and spends tokens.
  # Its decisions and paths live in test/llm/daemon-survival.ts, which is
  # unit-tested in test/daemon-survival-harness.test.ts.
  "test/llm/daemon-survival-run.ts",
  "src/web/client/components/**",
  "src/web/client/hooks/**",
  "src/web/client/addons/**",
  "src/web/client/lib/clipboard.ts",
  "src/web/client/main.tsx",
  "src/web/client/vite-env.d.ts",
  "src/plugin/pty/state-paths.ts",
  "src/web/server/handlers/server-info.ts",
]

[fmt]
# The house style, in Prettier's own option names: `bun fmt` reads this section
# (it does not read `biome.json`), so the formatter and the linter cannot drift
# apart on what the tree looks like.
printWidth = 100
singleQuote = true
semi = false
trailingComma = "es5"
# Off on purpose: the import order in this tree is curated - host imports, then
# relative ones, grouped by what a reader needs first - and sorting would churn
# every file for no gain.
sortImports = false
