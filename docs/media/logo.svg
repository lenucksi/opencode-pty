<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="520" height="128" role="img" aria-label="agentterm">
  <title>agentterm</title>
  <!-- The mark: a shell prompt and a second cursor on the same line. A chevron the
       agent works at, and a hollow cursor that is not the agent's - someone else can
       type here. -->
  <g transform="translate(8 12) scale(1.25)">
    <rect x="2.5" y="6" width="27" height="20" rx="4" fill="none" stroke="#58a6ff" stroke-width="2.5" />
    <path d="M8.5 12.4 14 16l-5.5 3.6" fill="none" stroke="#58a6ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="18.6" y="11.9" width="7" height="9.2" rx="1.6" fill="none" stroke="#58a6ff" stroke-width="2.3" opacity="0.62" />
  </g>
  <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#c9d1d9">agentterm</text>
  <text x="67" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="2.2" fill="#8b949e">PTY SESSIONS FOR AGENTS</text>
</svg>
