<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="520" height="128" role="img" aria-label="agentterm">
  <title>agentterm</title>
  <!-- The mark: one terminal, two readers. A filled cursor (the agent, typing) and an
       outlined one (the human, watching the same buffer) inside one frame. -->
  <g transform="translate(8 12) scale(1.25)" fill="none" stroke="#58a6ff" stroke-width="2.5">
    <rect x="2.5" y="6" width="27" height="20" rx="4" />
  </g>
  <g transform="translate(8 12) scale(1.25)" fill="#58a6ff">
    <rect x="8" y="12.5" width="6.5" height="9" rx="1.5" />
  </g>
  <g transform="translate(8 12) scale(1.25)" fill="none" stroke="#58a6ff" stroke-width="2">
    <rect x="17.5" y="12.5" width="6.5" height="9" rx="1.5" />
  </g>
  <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#c9d1d9">agentterm</text>
  <text x="65" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="2.2" fill="#8b949e">PTY SESSIONS FOR AGENTS</text>
</svg>
