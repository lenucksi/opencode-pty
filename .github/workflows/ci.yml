name: CI

on:
  push:
    branches: [local/modernized]
  pull_request:
    branches: [local/modernized]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        quality: [test, test:coverage, typecheck, lint, format, test:e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --force --frozen-lockfile

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Build
        run: bun build:prod

      - name: Run quality step
        run: bun ${{matrix.quality}}

  socket:
    # A job of its own rather than a step in the matrix: the matrix runs six
    # quality steps, and a dependency scan has no business running six times.
    #
    # This closes the real gap. `socket.yml` configures the Socket for GitHub app,
    # and that app evaluates pull requests. This repository pushes straight to
    # `local/modernized` and has no pull requests, so every Socket rule it declares
    # - `hasNativeCode` for bun-pty, `gitDependency` for ghostty-web - was inert on
    # GitHub. The scan ran only on the machine that happened to run the local gate.
    name: Socket.dev policy scan
    runs-on: ubuntu-24.04
    # `socket ci` stalled indefinitely on a bad connection once, so the bound is
    # explicit rather than the 6-hour default.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Socket analyses git-sourced dependencies; it needs the history to tell
          # a direct dependency from a transitive one.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --force --frozen-lockfile

      - name: Socket.dev policy scan
        env:
          CI: 'true'
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        # Pinned to the same version the local gate runs. test/ci-agrees.test.ts
        # fails if the two drift apart.
        run: bunx socket@1.1.180 ci

  dependency-review:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  nix-flake-test:
    name: Devenv CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Build (Devenv shell)
        run: devenv shell -- bun build:prod

      - name: Quality checks (bun test)
        run: devenv shell -- bun unittest
      - name: Quality checks (typecheck)
        run: devenv shell -- bun typecheck
      - name: Quality checks (lint)
        run: devenv shell -- bun lint
      - name: Quality checks (format)
        run: devenv shell -- bun format
      - name: Install Playwright Browsers (Devenv shell)
        run: devenv shell -- bash -lc 'PLAYWRIGHT_BROWSERS_PATH=0 bunx playwright install --with-deps chromium firefox'
      - name: Quality checks (test:e2e)
        run: devenv shell -- bash -lc 'PLAYWRIGHT_BROWSERS_PATH=0 bun test:e2e'
